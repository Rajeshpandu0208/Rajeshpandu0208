name: GitHub Snake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Rajeshpandu0208
          outputs: |
            dist/github-snake.svg?color_snake=%23ff4fa3&color_dots=%23180b22,%23311a3f,%23652b57,%23a83e76,%23ff4fa3
            dist/github-snake-dark.svg?color_snake=%23ff72c0&color_dots=%23180b22,%23311a3f,%23652b57,%23a83e76,%23ff4fa3

      - name: Publish to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin output:output || true
          if git show-ref --verify --quiet refs/heads/output; then
            git worktree add ../output-worktree output
          else
            mkdir -p ../output-worktree
            git worktree add --detach ../output-worktree
            cd ../output-worktree
            git switch --orphan output
            git rm -rf . || true
          fi

          rm -rf ../output-worktree/*
          cp -R dist/. ../output-worktree/

          cd ../output-worktree
          touch .nojekyll
          git add .
          git commit -m "chore: update contribution snake" || true
          git push origin HEAD:output --force
